# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@e75683076741e3a2499e0f3c112081a3dc95a66f # v0.0.11
    permissions:
      pull-requests: read
    with:
      scopes: data locale names decimal plural number currency unit spellout list calendar zone ixdtf datetime relative duration message grammar catalog collate search index generator mloccat oracle bench build family
