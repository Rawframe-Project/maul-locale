# Continuous integration: the pull request check, and the full check on
# main and every night, which fuzzes longer and checks the downloaded
# Unihan data. Each build cell is a CMake preset built by the
# organization's shared workflow; the other jobs run in the same CI image.
# docs/operations/checks.md explains each job, and tools/check.sh runs the
# same presets locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_LOCALE

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@d5bd0c28eb14b93e4cc608bdc18cb3d77603154c # v0.0.36
    permissions:
      pull-requests: read

  # The organization's documentation check, run from the pinned commit of
  # .github; tools/external holds third-party data, kept exactly as
  # published.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@d5bd0c28eb14b93e4cc608bdc18cb3d77603154c # v0.0.36
        with:
          exclude: tools/external

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@d5bd0c28eb14b93e4cc608bdc18cb3d77603154c # v0.0.36
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, test hygiene and labels,
  # the documentation site, the tables generated from data kept in the
  # repository, and clang-tidy.
  # It runs on documentation changes too, since the snippet check and the
  # site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # A PID 1 that reaps orphans, as cpp.yml's container has.
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        # A check that finds no file fails rather than passing on nothing.
        run: |
          clang-format --version
          mapfile -t files < <(git ls-files '*.[ch]' '*.cpp' | grep -v '^src/generated/')
          echo "${#files[@]} files"
          [ "${#files[@]}" -gt 500 ] || { echo "::error::too few files to format: ${#files[@]}"; exit 1; }
          clang-format --dry-run -Werror "${files[@]}"
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: The data format version moves with its layouts
        run: python3 tools/check_data_format.py
      # Every test registration, in the configurations that add tests: the
      # default one with the package test, and the shared build, which
      # leaves out the suites that read internal symbols.
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          python3 tools/check_test_hygiene.py
          cmake -B out/hygiene -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -D${PREFIX}_TEST_PACKAGE=ON >/dev/null
          cmake -B out/hygiene-shared -G Ninja -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 -D${PREFIX}_BUILD_SHARED=ON >/dev/null
          python3 tools/check_test_hygiene.py --ctest out/hygiene --ctest out/hygiene-shared
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: Tables generated from data in the repository
        # The shortest-digits tables, and the Turkish and Finnish lexicons
        # from tools/external.
        run: |
          python3 tools/gen_pow5_tables.py --check
          python3 tools/gen_turkish_marks.py --check
          python3 tools/gen_finnish_types.py --check
      # clang-tidy twice, one file per process, four at a time: on the
      # Release preset, where the assertions compile out and the paths
      # they ruled out open, and with them live, since a live assertion's
      # branches count toward a function's complexity.
      - name: clang-tidy, assertions compiled out
        run: |
          cmake --preset linux-clang-20 -B out/tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF
          files=(src/*.c)
          [ -f "${files[0]}" ] || { echo "::error::no source file for clang-tidy"; exit 1; }
          echo "${#files[@]} files"
          printf '%s\n' "${files[@]}" | xargs -P 4 -n 1 clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*'
      - name: clang-tidy, assertions live
        run: |
          cmake --preset linux-clang-20 -B out/tidy-asserts -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF
          files=(src/*.c)
          [ -f "${files[0]}" ] || { echo "::error::no source file for clang-tidy"; exit 1; }
          printf '%s\n' "${files[@]}" | xargs -P 4 -n 1 clang-tidy-20 -p out/tidy-asserts --quiet \
            --warnings-as-errors='*'

  # Every cell builds with warnings as errors and runs the whole suite, the
  # header tests included; the shared cell also installs the library and
  # builds samples/minimal against it (the "package" test).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-arm64-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-shared }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@d5bd0c28eb14b93e4cc608bdc18cb3d77603154c # v0.0.36
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The pinned CLDR and tzdb releases, in two jobs that run side by side:
  # `generated` regenerates src/generated/ byte for byte, and `cldr` runs
  # tools/check_cldr.sh, the library and the generator against CLDR's JSON
  # and conformance files, zic, zdump and zoneinfo, the ICU4C tables in
  # test/ and ICU's matcher test (docs/internals/conformance.md says what
  # each step proves). The releases are cached by their pins, so a run
  # downloads them only when a pin moves; main saves the cache.
  generated:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # A PID 1 that reaps orphans, as cpp.yml's container has.
      options: --init
    permissions:
      contents: read
    env:
      CLDR: .cache/cldr/cldr/common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment
        run: |
          echo "TZDB=.cache/tzdb/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-release.txt)" >> "$GITHUB_ENV"
          echo "TZDB_OLDER=.cache/tzdb/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-older.txt)" >> "$GITHUB_ENV"
      - name: Restore the releases
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: releases-${{ hashFiles('tools/cldr-release.txt', 'tools/tzdb-release.txt', 'tools/tzdb-older.txt') }}
      - name: Fetch CLDR and the tzdb
        timeout-minutes: 10
        run: |
          bash tools/fetch_cldr.sh .cache/cldr
          bash tools/fetch_tzdb.sh .cache/tzdb
          bash tools/fetch_tzdb.sh .cache/tzdb older
      - name: Save the releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: releases-${{ hashFiles('tools/cldr-release.txt', 'tools/tzdb-release.txt', 'tools/tzdb-older.txt') }}
      - name: Build the generator
        run: |
          cmake -B out/cldr -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 \
            -D${PREFIX}_WERROR=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF
          cmake --build out/cldr --target mlocgen
      - name: The generated sources are current
        # The generator gives the same bytes on every run, so a stale or
        # hand-edited file shows as a difference. Status, not diff: into a
        # clean src/generated, a file the generator no longer writes shows
        # as deleted and a new one it writes as added.
        run: |
          tools/regenerate.sh out/cldr/mlocgen "$CLDR" "$TZDB"
          stale=$(git status --porcelain -- src/generated)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::src/generated is stale: run tools/regenerate.sh"; exit 1
          fi

  cldr:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # A PID 1 that reaps orphans, as cpp.yml's container has.
      options: --init
    permissions:
      contents: read
    env:
      CLDR: .cache/cldr/cldr/common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment
        run: |
          echo "TZDB=.cache/tzdb/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-release.txt)" >> "$GITHUB_ENV"
          echo "TZDB_OLDER=.cache/tzdb/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-older.txt)" >> "$GITHUB_ENV"
      - name: Restore the releases
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: releases-${{ hashFiles('tools/cldr-release.txt', 'tools/tzdb-release.txt', 'tools/tzdb-older.txt') }}
      - name: Fetch CLDR and the tzdb
        timeout-minutes: 10
        run: |
          bash tools/fetch_cldr.sh .cache/cldr
          bash tools/fetch_tzdb.sh .cache/tzdb
          bash tools/fetch_tzdb.sh .cache/tzdb older
      - name: Build the generator and the conformance programs
        run: |
          cmake -B out/cldr -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 \
            -D${PREFIX}_WERROR=ON -D${PREFIX}_BUILD_BENCH=OFF
          cmake --build out/cldr --target conformance
      - name: Conformance
        run: tools/check_cldr.sh out/cldr .cache/cldr "$TZDB" "$TZDB_OLDER"

  # The calendar suites' full sweeps, which the suites sample and the cldr
  # job runs in Release, under AddressSanitizer and UBSan with assertions
  # on: at night and on a manual run.
  calendar-sweeps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # A PID 1 that reaps orphans, as cpp.yml's container has.
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the sweeps
        run: |
          cmake --preset linux-clang-20-asan
          cmake --build --preset linux-clang-20-asan --target conform_calendar conform_calendar_lunar \
            conform_calendar_arithmetic conform_calendar_oracle
      - name: The sweeps
        run: |
          for suite in calendar calendar_lunar calendar_arithmetic calendar_oracle; do
            echo "conform_$suite"
            "out/linux-clang-20-asan/conform_$suite"
          done

  # The quarantined tests (docs/operations/checks.md#quarantine), which the
  # test presets leave out, under AddressSanitizer and UBSan: at night and
  # on a manual run. A known flake's failure is a warning; a test that did
  # not run, a sanitizer report or a crash fails the job.
  quarantine:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # A PID 1 that reaps orphans, as cpp.yml's container has.
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset linux-clang-20-asan
          cmake --build --preset linux-clang-20-asan
      - name: The quarantined tests
        # The test presets' limit, which a run outside a preset does not
        # take: a hung flake then fails as a warning, not the whole job.
        run: tools/run_quarantine.sh out/linux-clang-20-asan --timeout 300

  # The Hanja readings' finals against the pinned Unihan database, an 8 MB
  # download: on every run of main (each push, the night, a manual run), and
  # on a pull request only when it changes the pin, the generator or the
  # generated header.
  unihan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # A PID 1 that reaps orphans, as cpp.yml's container has.
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Whether the pin or its output changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            # A pull request's checkout is its merge commit, whose first
            # parent is the base.
            git diff --name-only HEAD^1 HEAD |
              grep -qE '^(tools/unihan-release\.txt|tools/gen_hanja_finals\.py|src/generated/hanja_finals\.h)$' || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: The Hanja finals against Unihan
        if: steps.scope.outputs.run == 'true'
        run: |
          version=$(awk '$1 == "version" { print $2 }' tools/unihan-release.txt)
          mkdir -p .cache/unihan
          curl -sSfL --retry 3 -o .cache/unihan/Unihan.zip "https://www.unicode.org/Public/$version/ucd/Unihan.zip"
          python3 tools/gen_hanja_finals.py .cache/unihan --check

  # Each fuzz target looks for crashes and broken invariants: briefly on a
  # pull request, longer on main and at night. Each target's corpus carries
  # over in one cache entry; docs/operations/checks.md says why one job.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # A PID 1 that reaps orphans, as cpp.yml's container has.
      options: --init
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || 60 }}
      # A target's minimized corpus may not pass this, so one target's
      # growth cannot crowd the others out of the cache.
      CORPUS_LIMIT_MB: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_TOOLS=OFF -D${PREFIX}_BUILD_BENCH=OFF \
            -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz
      # Caches are immutable: each run on main saves a new entry, and every
      # run but a pull request's restores the latest. A pull request's run
      # starts from the committed seeds alone (maul-conventions.md).
      - name: Restore the corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run
        # Four targets at a time, one per core of the runner; each keeps its
        # full time. tools/fuzz_target.sh keeps each target's log and
        # findings on the runner and reports a finding without its input:
        # this repository's logs are public, and libFuzzer ends a finding's
        # log with the input itself.
        run: |
          targets=(out/fuzz/fuzz_*)
          [ -x "${targets[0]}" ] || { echo "::error::no fuzz target was built"; exit 1; }
          echo "${#targets[@]} targets"
          # Seeds start from valid files, which random bytes never form;
          # they join whatever corpus the cache brought, as its floor.
          for target in "${targets[@]}"; do
            name=$(basename "$target")
            mkdir -p "out/corpus/$name"
            if [ -d "test/seeds/$name" ]; then
              cp test/seeds/"$name"/* "out/corpus/$name"/
            fi
          done
          rm -rf out/fuzz-reports
          status=0
          printf '%s\n' "${targets[@]##*/}" |
            xargs -P 4 -I {} tools/fuzz_target.sh out/fuzz/{} \
              -max_total_time="$FUZZ_SECONDS" -max_len=512 out/corpus/{} || status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"
      # Each corpus is merged into a fresh directory through
      # tools/fuzz_target.sh --merge, which reruns every input, keeps the
      # log on the runner and fails on a finding as a run does. The merged
      # corpora are swapped in only when every merge passed, so a failed
      # merge leaves the old ones, and the save is skipped. This step and
      # the save run only when every target found nothing: a run that
      # found something keeps its corpus, which holds inputs near the
      # finding, out of the cache.
      - name: Minimize the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf out/merged out/fuzz-reports
          status=0
          targets=(out/fuzz/fuzz_*)
          printf '%s\n' "${targets[@]##*/}" |
            xargs -P 4 -I {} tools/fuzz_target.sh --merge out/fuzz/{} out/merged/{} out/corpus/{} ||
            status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          [ "$status" -eq 0 ] || exit "$status"
          for d in out/merged/*/; do
            name=$(basename "$d")
            rm -rf "out/corpus/$name" && mv "$d" "out/corpus/$name"
          done
          over=0
          {
            echo "| Target | Inputs | MB |"
            echo "|---|---|---|"
            for d in out/corpus/*/; do
              name=$(basename "$d")
              # The bytes the cache holds, not the disk blocks they take.
              mb=$(du -sm --apparent-size "$d" | cut -f1)
              echo "| $name | $(find "$d" -type f | wc -l) | $mb |"
              if [ "$mb" -gt "$CORPUS_LIMIT_MB" ]; then
                echo "::error::$name: corpus of $mb MB passes $CORPUS_LIMIT_MB MB" >&2
                over=1
              fi
            done
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$over"
      - name: Save the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}

  # The library and its tests under Emscripten and Node, through the web
  # preset, and the size of the static library. The CI image has no
  # Emscripten, so this job uses the runner and the emsdk action; it checks
  # for skipped tests and keeps the logs of a failure as cpp.yml does.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Configure
        run: cmake --preset web
      - name: Build
        run: cmake --build --preset web
      - name: Test
        run: |
          ctest --preset web --no-tests=error | tee "$RUNNER_TEMP/ctest.log"
          # A skipped, disabled or missing test fails the cell: it would hide
          # a check that no longer runs.
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web
          path: out/web/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        # The static library's size, reported, not gated.
        run: stat -c '%s bytes' out/web/libmaul-locale.a

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, msvc-headers, generated, cldr, calendar-sweeps, quarantine, unihan, fuzz, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
