# Continuous integration for Maul Locale.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # apt retries a stalled download and gives up on a dead one.
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30
  PREFIX: MAUL_LOCALE

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 clang-tidy-20
          sudo apt-get $APT_OPTIONS install -y -q ninja-build
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
          python3 tools/gen_pow5_tables.py --check
          # The Turkish and Finnish lexicons against the external data in
          # tools/external.
          python3 tools/gen_turkish_marks.py --check
          python3 tools/gen_finnish_types.py --check
          # The Hanja readings' finals against the Unihan database pinned.
          version=$(awk '$1 == "version" { print $2 }' tools/unihan-release.txt)
          mkdir -p unihan
          curl -sfL -o unihan/Unihan.zip "https://www.unicode.org/Public/$version/ucd/Unihan.zip"
          python3 tools/gen_hanja_finals.py unihan --check
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          for f in src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04,     cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_LOCALE_SANITIZE=ON" }
          - { name: linux-shared,        os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_LOCALE_BUILD_SHARED=ON" }
          - { name: linux-arm64-gcc-14,  os: ubuntu-24.04-arm, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: macos-clang,         os: macos-15,         cc: clang,    cxx: clang++,    config: Release, extra: "" }
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        if: runner.os == 'Linux'
        run: |
          sudo apt-get $APT_OPTIONS update -q
          # clang without its recommends, with the sanitizers' runtime.
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q gcc-14 g++-14 ninja-build
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        # A skipped test fails the step, as it would hide a broken job.
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      - name: Package
        if: matrix.name == 'linux-shared'
        run: cmake --install build --prefix "$PWD/package"

  # The pinned CLDR release: the generator's resolution against CLDR's JSON
  # of the same release, the generated sources, CLDR's conformance files,
  # and ICU's matcher test. The release is cached by tools/cldr-release.txt,
  # so a run fetches it only when the pin moves.
  cldr:
    name: cldr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/cldr-cache
          key: cldr-${{ hashFiles('tools/cldr-release.txt') }}
      - uses: actions/cache@v6
        with:
          path: ~/tzdb-cache
          key: tzdb-${{ hashFiles('tools/tzdb-release.txt', 'tools/tzdb-older.txt') }}
      - name: Fetch CLDR
        timeout-minutes: 15
        run: bash tools/fetch_cldr.sh ~/cldr-cache
      - name: Fetch tzdb
        timeout-minutes: 5
        run: |
          bash tools/fetch_tzdb.sh ~/tzdb-cache
          bash tools/fetch_tzdb.sh ~/tzdb-cache older
      - name: Install the compiler
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q gcc-14
      - name: Build the generator
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON -DCMAKE_C_COMPILER=gcc-14
          cmake --build build -j 4 --target mlocgen conform_likely conform_canonical conform_parents conform_direction conform_match conform_numbers conform_plurals conform_preferences conform_currency conform_units conform_unit_prefs conform_spellout conform_locale_names conform_datetime conform_zones conform_zone_codes conform_local conform_zoned conform_ixdtf conform_collation_root conform_collation_root_elements conform_collation_mappings conform_collation_builder conform_collation_fast_builder conform_collation conform_collation_rules conform_collation_keys
      - name: Root collation against allkeys
        run: |
          build/conform_collation_root ~/cldr-cache/cldr/common/uca/FractionalUCA.txt \
            ~/cldr-cache/cldr/common/uca/allkeys_CLDR.txt
      - name: Root elements against ICU4C 79's, Han's section aside
        run: |
          build/conform_collation_root_elements ~/cldr-cache/cldr/common/uca/FractionalUCA.txt \
            --expect 6110 ab8be4117eb364f2
      - name: The tailoring builder's lookup against the iterator
        run: build/conform_collation_mappings ~/cldr-cache/cldr/common/uca/FractionalUCA.txt
      - name: Every collation type built, its answers ICU4C 79's
        run: |
          build/conform_collation_builder ~/cldr-cache/cldr/common/uca/FractionalUCA.txt \
            --expect afcad9d236469b29 ~/cldr-cache/cldr/common/collation/*.xml \
            test/collation/crafted.xml
      - name: Every tailoring's unit read through the runtime iterator
        run: |
          build/conform_collation_builder ~/cldr-cache/cldr/common/uca/FractionalUCA.txt \
            --units ~/cldr-cache/cldr/common/collation/*.xml test/collation/crafted.xml
      - name: Every type's fast Latin table built, written and read back
        run: |
          build/conform_collation_fast_builder ~/cldr-cache/cldr/common/uca/FractionalUCA.txt \
            --expect edb9afb552346149 ~/cldr-cache/cldr/common/collation/*.xml \
            test/collation/crafted.xml
      - name: Tailored locales' sort keys, as ICU4C 79's where its data has them
        run: |
          set -o pipefail
          build/conform_collation_builder ~/cldr-cache/cldr/common/uca/FractionalUCA.txt \
            --queries ~/cldr-cache/cldr/common/collation/*.xml |
            build/conform_collation_keys src/generated/collation.mloc --expect 5191759b1ca1b666
      - name: Every collation rule string parsed
        run: build/conform_collation_rules ~/cldr-cache/cldr/common/collation/*.xml
      - name: The general compare against CollationTest
        run: |
          build/conform_collation src/generated/collation.mloc \
            ~/cldr-cache/cldr/common/uca/CollationTest_CLDR_NON_IGNORABLE_SHORT.txt \
            ~/cldr-cache/cldr/common/uca/CollationTest_CLDR_NON_IGNORABLE.txt
          build/conform_collation src/generated/collation.mloc --shifted \
            ~/cldr-cache/cldr/common/uca/CollationTest_CLDR_SHIFTED_SHORT.txt \
            ~/cldr-cache/cldr/common/uca/CollationTest_CLDR_SHIFTED.txt
          build/conform_collation src/generated/collation.mloc --identical \
            ~/cldr-cache/cldr/common/uca/CollationTest_CLDR_NON_IGNORABLE_SHORT.txt \
            ~/cldr-cache/cldr/common/uca/CollationTest_CLDR_NON_IGNORABLE.txt
          build/conform_collation src/generated/collation.mloc --shifted --identical \
            ~/cldr-cache/cldr/common/uca/CollationTest_CLDR_SHIFTED_SHORT.txt \
            ~/cldr-cache/cldr/common/uca/CollationTest_CLDR_SHIFTED.txt
      - name: Compare with the JSON
        run: |
          python3 tools/check_resolution.py build/mlocgen ~/cldr-cache/cldr/common ~/cldr-cache/json
          python3 tools/check_preferences.py build/conform_preferences ~/cldr-cache/json
          python3 tools/check_currency.py build/conform_currency ~/cldr-cache/json
          python3 tools/check_units.py build/conform_units \
            ~/cldr-cache/cldr/common/testData/units/unitsTest.txt
          python3 tools/check_unit_prefs.py build/conform_unit_prefs \
            ~/cldr-cache/cldr/common/testData/units
      - name: The generated sources are current
        # The generator gives the same bytes on every run, so a stale or
        # hand-edited file shows as a difference.
        run: |
          build/mlocgen generate ~/cldr-cache/cldr/common . ~/tzdb-cache/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-release.txt)
          git diff --exit-code src/generated || { echo "src/generated is stale: run mlocgen generate"; exit 1; }
      - name: The zones against zic and zdump
        # Every zone's offsets as zdump reads zic's output for the same source,
        # from 1800 to 2500 and in the range's last years.
        timeout-minutes: 20
        run: |
          command -v zic zdump
          python3 tools/check_zones.py build/conform_zones \
            ~/tzdb-cache/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-release.txt)
      - name: A zones file of an older release against its zic
        # A zones file mlocgen writes from another tzdb release opens beside the
        # library's zones, names its release, and gives that release's offsets.
        timeout-minutes: 20
        run: |
          older=~/tzdb-cache/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-older.txt)
          build/mlocgen zonesfile $older ~/cldr-cache/cldr/common build/zones-older.mloc
          python3 tools/check_zones.py build/conform_zones $older build/zones-older.mloc
      - name: Skeleton matching against ICU
        # The best pattern mlocgen gives for each question of CLDR's skeleton
        # test files equals ICU4C 79's, or the listed one.
        timeout-minutes: 5
        run: |
          python3 tools/check_skeletons.py build/mlocgen ~/cldr-cache/cldr/common \
            test/skeletons_icu.tsv tools/skeleton-exceptions.txt
      - name: Interval patterns against ICU
        # The interval patterns mlocgen gives for each question of the table
        # equal ICU4C 79's DateIntervalFormat's, or the listed ones.
        timeout-minutes: 5
        run: |
          python3 tools/check_intervals.py build/mlocgen ~/cldr-cache/cldr/common \
            test/intervals_icu.tsv tools/interval-exceptions.txt
      - name: Semantic skeletons and dates against CLDR's test data
        # Each semantic skeleton of datetime.json maps to its classical
        # skeleton, and each date case gives its text.
        timeout-minutes: 5
        run: |
          python3 tools/check_datetime.py build/mlocgen ~/cldr-cache/cldr/common \
            build/conform_datetime src/generated/dates.mloc src/generated/spellout.mloc \
            src/generated/zone-names.mloc src/generated/names.mloc
      - name: BCP 47 ids and Windows names against CLDR
        # Every id, identifier and Windows mapping, as check_zone_codes.py reads
        # CLDR's files.
        timeout-minutes: 5
        run: |
          python3 tools/check_zone_codes.py build/conform_zone_codes ~/cldr-cache/cldr/common \
            ~/tzdb-cache/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-release.txt)
      - name: Local times against zoneinfo
        # The instants of the local times around every change from 1800 to 2500,
        # their disambiguations, the start of those days and the local time at
        # each change, as Python's zoneinfo reads zic's output for the same
        # source.
        timeout-minutes: 20
        run: |
          python3 tools/check_local.py build/conform_local \
            ~/tzdb-cache/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-release.txt)
      - name: Temporal strings against ECMA-262's grammar
        # Every goal, offset, time zone, calendar and duration string, against
        # check_ixdtf.py's second reading.
        timeout-minutes: 10
        run: python3 tools/check_ixdtf.py build/conform_ixdtf
      - name: Zoned arithmetic against ECMA-262
        # Additions, rounded differences, rounding and offsets around every
        # change from 1900 to 2040, against check_zoned.py's reading of the
        # specification over zoneinfo.
        timeout-minutes: 20
        run: |
          python3 tools/check_zoned.py build/conform_zoned \
            ~/tzdb-cache/tzdb-$(awk '$1 == "release" { print $2 }' tools/tzdb-release.txt)
      - name: Conformance
        run: |
          ids=~/cldr-cache/cldr/common/testData/localeIdentifiers
          build/conform_likely $ids/likelySubtags.txt
          build/conform_canonical $ids/localeCanonicalization.txt
          ls ~/cldr-cache/cldr/common/main | grep '\.xml$' | sed 's/\.xml$//' |
            awk '{ print "main\t" $0; print "collation\t" $0 }' |
            build/mlocgen chains ~/cldr-cache/cldr/common | build/conform_parents
          python3 tools/cldr_directions.py ~/cldr-cache/cldr/common | build/conform_direction
          build/mlocgen plural-samples ~/cldr-cache/cldr/common | build/conform_plurals
          cat ~/cldr-cache/cldr/common/testData/decimal/*.tsv |
            build/conform_numbers tools/number-exceptions.txt
          build/conform_spellout src/generated/spellout.mloc \
            ~/cldr-cache/cldr/common/testData/rbnf/*.ssv
          build/conform_locale_names src/generated/names.mloc src/generated/subdivisions.mloc \
            $ids/localeDisplayName.txt tools/locale-name-exceptions.txt
      - name: Matching
        # ICU's matcher test, kept in tools/external/icu.
        timeout-minutes: 5
        run: build/conform_match tools/external/icu/localeMatcherTest.txt tools/match-exceptions.txt

  # Each fuzz target runs for one minute on every push.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          # clang without its recommends, with libFuzzer's runtime.
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_TOOLS=OFF -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          mkdir -p fuzz-crashes
          for target in build/fuzz_*; do
            mkdir -p "corpus-$(basename $target)"
            # Seeds start from valid files, which random bytes never form.
            if [ -d "test/seeds/$(basename $target)" ]; then
              cp test/seeds/"$(basename $target)"/* "corpus-$(basename $target)"/
            fi
            "$target" -max_total_time=60 -max_len=512 -artifact_prefix=fuzz-crashes/ \
              "corpus-$(basename $target)"
          done
      - name: Keep a crash's input
        # libFuzzer writes the input that failed; without it a crash found
        # here cannot be reproduced.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz-crashes/

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        # A skipped test fails the step, as it would hide a broken job.
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      # The public headers alone under MSVC's cl, as C17 and C++17 with
      # /W4 /WX, which cannot build the library itself (family record 0008).
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: |
          for t in build/test_*.js; do node "$t" || exit 1; done
      - name: Size
        # The static library's size, reported, not gated (family record
        # 0013).
        run: stat -c '%s bytes' build/libmaul-locale.a
